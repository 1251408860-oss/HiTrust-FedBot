name: hitrust-fedbot
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=2.2.6
  - pandas=2.3.3
  - scipy=1.15.3
  - scikit-learn=1.7.2
  - matplotlib=3.10.8
  - networkx=3.4.2
  - pyyaml=6.0.3
  - pytest=9.0.2
  - seaborn=0.13.2
  - scapy=2.7.0
  - pip:
      - torch==2.10.0
      - torchvision==0.25.0
      - torchaudio==2.10.0
      - torch-geometric==2.7.0
      - flwr==1.26.1
      - ray==2.51.1
